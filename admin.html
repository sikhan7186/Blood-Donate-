<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>রক্তসেতু Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#C81E3A; --maroon:#5C0F1E; --ivory:#FFF8F3; --ink:#241B1B;
    --sage:#3F7D5C; --muted:#8A7A73; --line:#EFE2DA; --card:#FFFFFF; --gold:#B8863E; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--ivory); color:var(--ink); font-family:'Hind Siliguri', sans-serif; min-height:100vh;}
  .display{font-family:'Tiro Bangla', serif;}
  #app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    position:sticky; top:0; z-index:40; background:var(--maroon); color:#fff;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:9px; font-family:'Tiro Bangla', serif; font-size:19px;}
  .brand .tag{background:rgba(255,255,255,.15); font-size:11px; font-family:'Hind Siliguri',sans-serif; padding:2px 8px; border-radius:10px; margin-left:4px;}
  .icon-btn{background:rgba(255,255,255,.12); border:none; color:#fff; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer;}

  .content{flex:1; padding:18px 18px 90px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .card h2{font-family:'Tiro Bangla', serif; font-size:19px; margin:0 0 14px; color:var(--maroon);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .field input, .field select{width:100%; padding:12px 13px; border-radius:11px; border:1.5px solid var(--line); font-family:'Hind Siliguri', sans-serif; font-size:15px; background:#FCFAF8; color:var(--ink);}
  .field input:focus, .field select:focus{outline:none; border-color:var(--crimson); background:#fff;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .btn{width:100%; padding:13px; border-radius:12px; border:none; font-size:15.5px; font-weight:700; font-family:'Hind Siliguri', sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--crimson); color:#fff;}
  .btn-outline{background:transparent; color:var(--maroon); border:1.5px solid var(--maroon);}

  .msg{padding:11px 14px; border-radius:10px; font-size:13.5px; margin-bottom:14px; display:none;}
  .msg.error{background:#FDEAEA; color:#9C2020; display:block;}
  .msg.success{background:#E9F5EE; color:var(--sage); display:block;}

  .spinner{width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .hidden{display:none !important;}

  /* Tab nav */
  .tabnav{display:flex; gap:6px; overflow-x:auto; padding:0 18px 14px; scrollbar-width:none;}
  .tabnav::-webkit-scrollbar{display:none;}
  .tab-chip{flex-shrink:0; padding:9px 15px; border-radius:20px; border:1.5px solid var(--line); background:#fff; font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer;}
  .tab-chip.active{background:var(--maroon); border-color:var(--maroon); color:#fff;}

  /* Stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .stat-box{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:center;}
  .stat-num{font-family:'Tiro Bangla', serif; font-size:26px; color:var(--crimson);}
  .stat-label{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bar-label{width:36px; font-weight:700; font-size:13px; flex-shrink:0;}
  .bar-track{flex:1; height:12px; background:var(--line); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--crimson); border-radius:6px;}
  .bar-count{width:28px; text-align:right; font-size:12px; color:var(--muted); flex-shrink:0;}

  /* Lists */
  .search-input{width:100%; padding:11px 13px; border-radius:11px; border:1.5px solid var(--line); background:#FCFAF8; font-family:'Hind Siliguri', sans-serif; font-size:14px; margin-bottom:14px;}
  .row-card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px; margin-bottom:10px;}
  .row-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .row-name{font-weight:700; font-size:14.5px;}
  .row-sub{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .row-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .badge-verified{background:#EAF5EC; color:var(--sage);}
  .badge-unverified{background:#F4EDE9; color:var(--muted);}
  .badge-blocked{background:#FDEAEA; color:#C81E3A;}
  .badge-bg{background:var(--crimson); color:#fff;}
  .row-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .mini-btn{padding:7px 12px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink);}
  .mini-btn.verify{border-color:var(--sage); color:var(--sage);}
  .mini-btn.block{border-color:var(--crimson); color:var(--crimson);}
  .mini-btn.danger{background:var(--crimson); border-color:var(--crimson); color:#fff;}
  .empty-state{text-align:center; padding:40px 16px; color:var(--muted);}
  .empty-state .icon{font-size:36px; margin-bottom:10px;}

  .fab{position:fixed; left:50%; transform:translateX(calc(-50% + 220px)); bottom:24px; z-index:41; width:54px; height:54px; border-radius:50%; background:var(--crimson); color:#fff; border:none; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(200,30,58,.4); cursor:pointer;}
  @media (max-width:560px){ .fab{transform:translateX(calc(-50% + 180px));} }

  #loader{position:fixed; inset:0; background:rgba(255,248,243,.9); z-index:100; display:flex; align-items:center; justify-content:center;}
  #loader .spin{width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--crimson); border-radius:50%; animation:spin .7s linear infinite;}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand">রক্তসেতু <span class="tag">Admin</span></div>
    <button class="icon-btn hidden" id="logoutBtn">⎋</button>
  </div>

  <!-- ===================== LOGIN ===================== -->
  <div id="view-login">
    <div class="content" style="padding-top:26px;">
      <div class="card">
        <h2>Admin লগইন</h2>
        <div class="msg error" id="loginError"></div>
        <div class="field">
          <label>ইমেইল</label>
          <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
        </div>
        <div class="field">
          <label>পাসওয়ার্ড</label>
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" id="loginBtn"><span id="loginBtnLabel">লগইন করুন</span></button>
      </div>
    </div>
  </div>

  <!-- ===================== ACCESS DENIED ===================== -->
  <div id="view-denied" class="hidden">
    <div class="content" style="padding-top:26px;">
      <div class="card" style="text-align:center;">
        <h2>⛔ প্রবেশাধিকার নেই</h2>
        <p style="color:var(--muted); font-size:14px;">এই অ্যাকাউন্টের Admin অ্যাক্সেস নেই। শুধুমাত্র অনুমোদিত অ্যাডমিন এই প্যানেলে ঢুকতে পারবেন।</p>
        <button class="btn btn-outline" id="deniedLogoutBtn" style="margin-top:12px;">লগআউট করুন</button>
      </div>
    </div>
  </div>

  <!-- ===================== DASHBOARD ===================== -->
  <div id="view-dashboard" class="hidden">
    <div class="tabnav" id="tabnav"></div>

    <div class="content" style="padding-top:0;">

      <!-- STATS -->
      <div id="tab-stats">
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-num" id="statTotalUsers">—</div><div class="stat-label">মোট ইউজার</div></div>
          <div class="stat-box"><div class="stat-num" id="statAvailable">—</div><div class="stat-label">উপলব্ধ ডোনার</div></div>
          <div class="stat-box"><div class="stat-num" id="statActiveReq">—</div><div class="stat-label">সক্রিয় অনুরোধ</div></div>
          <div class="stat-box"><div class="stat-num" id="statPendingReports">—</div><div class="stat-label">পেন্ডিং রিপোর্ট</div></div>
        </div>
        <div class="card">
          <h2>রক্তের গ্রুপ অনুযায়ী ডোনার</h2>
          <div id="bgStats"></div>
        </div>
      </div>

      <!-- USERS -->
      <div id="tab-users" class="hidden">
        <input type="text" class="search-input" id="userSearchInput" placeholder="নাম বা মোবাইল দিয়ে খুঁজুন">
        <div id="usersList"></div>
      </div>

      <!-- REQUESTS -->
      <div id="tab-requests" class="hidden">
        <div id="reqAdminList"></div>
      </div>

      <!-- HOSPITALS -->
      <div id="tab-hospitals" class="hidden">
        <div id="hospAdminList"></div>
      </div>

      <!-- REPORTS -->
      <div id="tab-reports" class="hidden">
        <div id="reportsList"></div>
      </div>

    </div>

    <button class="fab hidden" id="fabAddHospital" title="নতুন হাসপাতাল">+</button>
  </div>

  <!-- ===================== ADD/EDIT HOSPITAL ===================== -->
  <div id="view-hosp-form" class="hidden">
    <div class="content" style="padding-top:22px;">
      <div class="card">
        <h2 id="hospFormTitle">নতুন হাসপাতাল/ব্লাড ব্যাংক</h2>
        <div class="msg error" id="hospFormError"></div>
        <div class="field">
          <label>নাম</label>
          <input type="text" id="hfName" placeholder="যেমন: নোয়াখালী জেনারেল হাসপাতাল">
        </div>
        <div class="field">
          <label>ধরন</label>
          <select id="hfType">
            <option value="hospital">হাসপাতাল</option>
            <option value="bloodbank">ব্লাড ব্যাংক</option>
            <option value="organization">সংগঠন</option>
          </select>
        </div>
        <div class="row2">
          <div class="field">
            <label>জেলা</label>
            <select id="hfDistrict"></select>
          </div>
          <div class="field">
            <label>উপজেলা</label>
            <input type="text" id="hfUpazila">
          </div>
        </div>
        <div class="field">
          <label>ফোন নম্বর</label>
          <input type="text" id="hfPhone" placeholder="ঐচ্ছিক">
        </div>
        <div class="field">
          <label>ঠিকানা</label>
          <input type="text" id="hfAddress" placeholder="ঐচ্ছিক">
        </div>
        <button class="btn btn-primary" id="hfSubmitBtn"><span id="hfBtnLabel">সংরক্ষণ করুন</span></button>
        <button class="btn btn-outline" id="hfCancelBtn" style="margin-top:10px;">← বাতিল করুন</button>
      </div>
    </div>
  </div>

  <div id="loader" class="hidden"><div class="spin"></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNd3MlvEUruLwpyNPhK1-aGRYzhf5tY0Q",
  authDomain: "blood-donate-a4efa.firebaseapp.com",
  databaseURL: "https://blood-donate-a4efa-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "blood-donate-a4efa",
  storageBucket: "blood-donate-a4efa.firebasestorage.app",
  messagingSenderId: "14667467986",
  appId: "1:14667467986:web:69c777f7d08e584572f10b",
  measurementId: "G-DQCB7QQC9D"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const DISTRICTS = ["বাগেরহাট","বান্দরবান","বরগুনা","বরিশাল","ভোলা","বগুড়া","ব্রাহ্মণবাড়িয়া","চাঁদপুর","চট্টগ্রাম","চুয়াডাঙ্গা","কুমিল্লা","কক্সবাজার","ঢাকা","দিনাজপুর","ফরিদপুর","ফেনী","গাইবান্ধা","গাজীপুর","গোপালগঞ্জ","হবিগঞ্জ","জামালপুর","যশোর","ঝালকাঠি","ঝিনাইদহ","জয়পুরহাট","খাগড়াছড়ি","খুলনা","কিশোরগঞ্জ","কুড়িগ্রাম","কুষ্টিয়া","লক্ষ্মীপুর","লালমনিরহাট","মাদারীপুর","মাগুরা","মানিকগঞ্জ","মেহেরপুর","মৌলভীবাজার","মুন্সিগঞ্জ","ময়মনসিংহ","নওগাঁ","নড়াইল","নারায়ণগঞ্জ","নরসিংদী","নাটোর","নেত্রকোনা","নীলফামারী","নোয়াখালী","পাবনা","পঞ্চগড়","পটুয়াখালী","পিরোজপুর","রাজবাড়ী","রাজশাহী","রাঙ্গামাটি","রংপুর","সাতক্ষীরা","শরীয়তপুর","শেরপুর","সিরাজগঞ্জ","সুনামগঞ্জ","সিলেট","টাঙ্গাইল","ঠাকুরগাঁও"];
const BLOOD_GROUPS = ["A+","A-","B+","B-","AB+","AB-","O+","O-"];
const HOSP_TYPE_LABEL = { hospital:'হাসপাতাল', bloodbank:'ব্লাড ব্যাংক', organization:'সংগঠন' };
const URGENCY_LABEL = { critical:'অতি জরুরি', urgent:'জরুরি', normal:'সাধারণ' };
const STATUS_LABEL = { active:'সক্রিয়', fulfilled:'সম্পন্ন', cancelled:'বাতিল' };

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function showLoader(){show('loader');}
function hideLoader(){hide('loader');}
function setMsg(id, text, type){ const el=document.getElementById(id); el.textContent=text; el.className='msg '+type; }
function clearMsg(id){ const el=document.getElementById(id); el.textContent=''; el.className='msg'; }

let allUsers = {};
let allRequestsAdmin = {};
let allHospitalsAdmin = {};
let allReports = {};

/* ---------------------- Login ---------------------- */
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  clearMsg('loginError');
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ setMsg('loginError','ইমেইল ও পাসওয়ার্ড দিন','error'); return; }
  const label = document.getElementById('loginBtnLabel');
  label.innerHTML = '<span class="spinner"></span>';
  document.getElementById('loginBtn').disabled = true;
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    setMsg('loginError','লগইন ব্যর্থ হয়েছে। ইমেইল/পাসওয়ার্ড যাচাই করুন।','error');
    label.textContent = 'লগইন করুন';
    document.getElementById('loginBtn').disabled = false;
  }
});
document.getElementById('logoutBtn').addEventListener('click', ()=> auth.signOut());
document.getElementById('deniedLogoutBtn').addEventListener('click', ()=> auth.signOut());

/* ---------------------- Auth state ---------------------- */
auth.onAuthStateChanged(async (user)=>{
  showLoader();
  if(user){
    show('logoutBtn');
    const snap = await db.ref('users/'+user.uid+'/isAdmin').once('value');
    if(snap.val() === true){
      hide('view-login'); hide('view-denied'); show('view-dashboard');
      initTabs();
      loadAllData();
    } else {
      hide('view-login'); hide('view-dashboard'); show('view-denied');
    }
  } else {
    hide('logoutBtn');
    hide('view-denied'); hide('view-dashboard'); show('view-login');
    document.getElementById('loginBtnLabel').textContent = 'লগইন করুন';
    document.getElementById('loginBtn').disabled = false;
  }
  hideLoader();
});

/* ---------------------- Tabs ---------------------- */
const TABS = [
  {key:'stats', label:'📊 পরিসংখ্যান'},
  {key:'users', label:'👥 ইউজার'},
  {key:'requests', label:'🚨 অনুরোধ'},
  {key:'hospitals', label:'🏥 হাসপাতাল'},
  {key:'reports', label:'⚠️ রিপোর্ট'}
];
function initTabs(){
  const nav = document.getElementById('tabnav');
  nav.innerHTML = TABS.map((t,i)=>`<div class="tab-chip ${i===0?'active':''}" data-tab="${t.key}">${t.label}</div>`).join('');
  nav.querySelectorAll('.tab-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      nav.querySelectorAll('.tab-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      TABS.forEach(t=> hide('tab-'+t.key));
      show('tab-'+chip.dataset.tab);
      document.getElementById('fabAddHospital').classList.toggle('hidden', chip.dataset.tab !== 'hospitals');
    });
  });
}

function loadAllData(){
  db.ref('users').on('value', snap=>{
    allUsers = snap.val() || {};
    renderStats(); renderUsers();
  });
  db.ref('requests').on('value', snap=>{
    allRequestsAdmin = snap.val() || {};
    renderStats(); renderRequestsAdmin();
  });
  db.ref('hospitals').on('value', snap=>{
    allHospitalsAdmin = snap.val() || {};
    renderHospitalsAdmin();
  });
  db.ref('reports').on('value', snap=>{
    allReports = snap.val() || {};
    renderStats(); renderReports();
  });
}

/* ---------------------- Stats ---------------------- */
function renderStats(){
  const users = Object.values(allUsers);
  document.getElementById('statTotalUsers').textContent = users.length;
  document.getElementById('statAvailable').textContent = users.filter(u=>u.available).length;
  const reqs = Object.values(allRequestsAdmin);
  document.getElementById('statActiveReq').textContent = reqs.filter(r=>r.status==='active').length;
  const reports = Object.values(allReports);
  document.getElementById('statPendingReports').textContent = reports.filter(r=>r.status==='pending').length;

  const bgCounts = {};
  BLOOD_GROUPS.forEach(bg=> bgCounts[bg]=0);
  users.forEach(u=>{ if(bgCounts[u.bloodGroup]!==undefined) bgCounts[u.bloodGroup]++; });
  const max = Math.max(1, ...Object.values(bgCounts));
  document.getElementById('bgStats').innerHTML = BLOOD_GROUPS.map(bg=>{
    const pct = Math.round((bgCounts[bg]/max)*100);
    return `<div class="bar-row">
      <div class="bar-label">${bg}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-count">${bgCounts[bg]}</div>
    </div>`;
  }).join('');
}

/* ---------------------- Users ---------------------- */
function renderUsers(){
  const wrap = document.getElementById('usersList');
  const q = (document.getElementById('userSearchInput').value || '').trim().toLowerCase();
  let entries = Object.entries(allUsers);
  if(q){
    entries = entries.filter(([uid,u])=>
      (u.name||'').toLowerCase().includes(q) || (u.mobile||'').includes(q)
    );
  }
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="icon">👥</div>কোনো ইউজার পাওয়া যায়নি।</div>`;
    return;
  }
  wrap.innerHTML = entries.map(([uid,u])=>{
    const verifiedBadge = u.verified ? `<span class="badge badge-verified">✔ ভেরিফাইড</span>` : `<span class="badge badge-unverified">অভেরিফাইড</span>`;
    const blockedBadge = u.blocked ? `<span class="badge badge-blocked">ব্লকড</span>` : '';
    return `<div class="row-card">
      <div class="row-top">
        <div>
          <div class="row-name">${u.name||'নাম নেই'}</div>
          <div class="row-sub">${u.mobile||''} · ${u.district||''}, ${u.upazila||''}</div>
        </div>
        <span class="badge badge-bg">${u.bloodGroup||'—'}</span>
      </div>
      <div class="row-badges">${verifiedBadge} ${blockedBadge}</div>
      <div class="row-actions">
        <button class="mini-btn verify" data-uid="${uid}" data-action="toggleVerify">${u.verified?'✔ ভেরিফাই বাতিল':'✔ ভেরিফাই করুন'}</button>
        <button class="mini-btn block" data-uid="${uid}" data-action="toggleBlock">${u.blocked?'আনব্লক করুন':'🚫 ব্লক করুন'}</button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const uid = btn.dataset.uid;
      const u = allUsers[uid];
      if(btn.dataset.action==='toggleVerify') db.ref('users/'+uid+'/verified').set(!u.verified);
      if(btn.dataset.action==='toggleBlock') db.ref('users/'+uid+'/blocked').set(!u.blocked);
    });
  });
}
document.getElementById('userSearchInput').addEventListener('input', renderUsers);

/* ---------------------- Requests ---------------------- */
function renderRequestsAdmin(){
  const wrap = document.getElementById('reqAdminList');
  const entries = Object.entries(allRequestsAdmin).sort((a,b)=>(b[1].postedAt||0)-(a[1].postedAt||0));
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="icon">🚨</div>কোনো অনুরোধ নেই।</div>`;
    return;
  }
  wrap.innerHTML = entries.map(([id,r])=>{
    return `<div class="row-card">
      <div class="row-top">
        <div>
          <div class="row-name">${r.bloodGroup} · ${r.patientName||''}</div>
          <div class="row-sub">🏥 ${r.hospitalName||''}, ${r.district||''} · ${URGENCY_LABEL[r.urgency]||''}</div>
        </div>
        <span class="badge ${r.status==='active'?'badge-bg':'badge-verified'}">${STATUS_LABEL[r.status]||r.status}</span>
      </div>
      <div class="row-actions">
        <button class="mini-btn verify" data-id="${id}" data-action="fulfil">✔ সম্পন্ন করুন</button>
        <button class="mini-btn danger" data-id="${id}" data-action="delete">🗑 মুছুন</button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(btn.dataset.action==='fulfil') db.ref('requests/'+id+'/status').set('fulfilled');
      if(btn.dataset.action==='delete'){
        if(confirm('এই অনুরোধটি স্থায়ীভাবে মুছে ফেলতে চান?')) db.ref('requests/'+id).remove();
      }
    });
  });
}

/* ---------------------- Hospitals ---------------------- */
function populateHfDistrict(){
  const sel = document.getElementById('hfDistrict');
  sel.innerHTML = '<option value="">নির্বাচন করুন</option>' +
    DISTRICTS.sort((a,b)=>a.localeCompare(b,'bn')).map(d=>`<option value="${d}">${d}</option>`).join('');
}
populateHfDistrict();

let editingHospitalId = null;

function renderHospitalsAdmin(){
  const wrap = document.getElementById('hospAdminList');
  const entries = Object.entries(allHospitalsAdmin);
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="icon">🏥</div>এখনো কোনো হাসপাতাল/ব্লাড ব্যাংক যোগ করা হয়নি। নিচের + বাটনে চাপুন।</div>`;
    return;
  }
  wrap.innerHTML = entries.map(([id,h])=>{
    return `<div class="row-card">
      <div class="row-top">
        <div>
          <div class="row-name">${h.name}</div>
          <div class="row-sub">${HOSP_TYPE_LABEL[h.type]||h.type} · ${h.district||''}, ${h.upazila||''}</div>
        </div>
        <span class="badge ${h.verified===false?'badge-blocked':'badge-verified'}">${h.verified===false?'অপ্রকাশিত':'প্রকাশিত'}</span>
      </div>
      <div class="row-actions">
        <button class="mini-btn verify" data-id="${id}" data-action="toggleShow">${h.verified===false?'👁 প্রকাশ করুন':'🙈 লুকান'}</button>
        <button class="mini-btn block" data-id="${id}" data-action="edit">✎ সম্পাদনা</button>
        <button class="mini-btn danger" data-id="${id}" data-action="delete">🗑 মুছুন</button>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const h = allHospitalsAdmin[id];
      if(btn.dataset.action==='toggleShow') db.ref('hospitals/'+id+'/verified').set(h.verified===false ? true : false);
      if(btn.dataset.action==='delete'){
        if(confirm('এই তালিকাটি মুছে ফেলতে চান?')) db.ref('hospitals/'+id).remove();
      }
      if(btn.dataset.action==='edit') openHospitalForm(id, h);
    });
  });
}

function openHospitalForm(id, h){
  editingHospitalId = id || null;
  document.getElementById('hospFormTitle').textContent = id ? 'হাসপাতাল সম্পাদনা করুন' : 'নতুন হাসপাতাল/ব্লাড ব্যাংক';
  document.getElementById('hfName').value = h ? h.name||'' : '';
  document.getElementById('hfType').value = h ? h.type||'hospital' : 'hospital';
  document.getElementById('hfDistrict').value = h ? h.district||'' : '';
  document.getElementById('hfUpazila').value = h ? h.upazila||'' : '';
  document.getElementById('hfPhone').value = h ? h.phone||'' : '';
  document.getElementById('hfAddress').value = h ? h.address||'' : '';
  clearMsg('hospFormError');
  hide('view-dashboard'); show('view-hosp-form');
}
document.getElementById('fabAddHospital').addEventListener('click', ()=> openHospitalForm(null,null));
document.getElementById('hfCancelBtn').addEventListener('click', ()=>{ hide('view-hosp-form'); show('view-dashboard'); });

document.getElementById('hfSubmitBtn').addEventListener('click', async ()=>{
  clearMsg('hospFormError');
  const name = document.getElementById('hfName').value.trim();
  const type = document.getElementById('hfType').value;
  const district = document.getElementById('hfDistrict').value;
  const upazila = document.getElementById('hfUpazila').value.trim();
  const phone = document.getElementById('hfPhone').value.trim();
  const address = document.getElementById('hfAddress').value.trim();
  if(!name){ setMsg('hospFormError','নাম লিখুন','error'); return; }
  if(!district){ setMsg('hospFormError','জেলা নির্বাচন করুন','error'); return; }
  if(!upazila){ setMsg('hospFormError','উপজেলার নাম লিখুন','error'); return; }

  const label = document.getElementById('hfBtnLabel');
  label.innerHTML = '<span class="spinner"></span>';
  document.getElementById('hfSubmitBtn').disabled = true;
  try{
    const data = { name, type, district, upazila, phone, address, verified: true };
    if(editingHospitalId){
      await db.ref('hospitals/'+editingHospitalId).update(data);
    } else {
      await db.ref('hospitals').push(data);
    }
    hide('view-hosp-form'); show('view-dashboard');
  }catch(e){
    setMsg('hospFormError','সংরক্ষণ করা যায়নি, আবার চেষ্টা করুন।','error');
  }
  label.textContent = 'সংরক্ষণ করুন';
  document.getElementById('hfSubmitBtn').disabled = false;
});

/* ---------------------- Reports ---------------------- */
function renderReports(){
  const wrap = document.getElementById('reportsList');
  const entries = Object.entries(allReports).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  if(entries.length===0){
    wrap.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div>কোনো রিপোর্ট নেই।</div>`;
    return;
  }
  wrap.innerHTML = entries.map(([id,r])=>{
    const statusBadge = r.status==='pending' ? `<span class="badge badge-blocked">পেন্ডিং</span>` : `<span class="badge badge-verified">সমাধান হয়েছে</span>`;
    return `<div class="row-card">
      <div class="row-top">
        <div>
          <div class="row-name">${r.reportedName||'অজানা ইউজার'}</div>
          <div class="row-sub">কারণ: ${r.reason||'—'}</div>
        </div>
        ${statusBadge}
      </div>
      ${r.status==='pending' ? `
      <div class="row-actions">
        <button class="mini-btn block" data-id="${id}" data-uid="${r.reportedUid}" data-action="blockUser">🚫 ইউজার ব্লক করুন</button>
        <button class="mini-btn verify" data-id="${id}" data-action="dismiss">খারিজ করুন</button>
      </div>` : ''}
    </div>`;
  }).join('');

  wrap.querySelectorAll('.mini-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      if(btn.dataset.action==='blockUser'){
        db.ref('users/'+btn.dataset.uid+'/blocked').set(true);
        db.ref('reports/'+id+'/status').set('resolved');
      }
      if(btn.dataset.action==='dismiss'){
        db.ref('reports/'+id+'/status').set('resolved');
      }
    });
  });
}
</script>
</body>
